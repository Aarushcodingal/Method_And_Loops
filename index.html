<!DOCTYPE html>
<html>

<head>
    <title>Methods and Loops Project</title>
</head>

<body>

    <h1>Methods and Loops</h1>
    <h3>Numbers from 1 to 10</h3>

    <div id="numbers"></div>
    <p id="random"></p>
    <p id="day"></p>

    <script>
        // Part 1: Numbers 1 to 10 using a for loop
        let text = "";
        for (let i = 1; i <= 10; i++)
        {
            text += i + "<br>";
        }
        document.getElementById("numbers").innerHTML = text;

        // Part 2: Random whole number from 0 to 99
        let randomNumber = Math.floor(Math.random() * 100);
        document.getElementById("random").innerHTML = "The random number is " + randomNumber + ". It changes each time you reload.";

        // Part 3: Today's day number (0 is Sunday)
        let dayNumber = new Date().getDay();
        document.getElementById("day").innerHTML = "Today's day number is " + dayNumber;
    </script>

</body>

</html>
